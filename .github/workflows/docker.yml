name: docker

# 构建网关镜像（amd64 + arm64）并推送到 GitHub 容器镜像库。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 推送 v* tag（如 v3.5.1）：产出 3.5.1 与 :latest
#   · 推送带预发布后缀的 tag（如 v3.5.0-beta.1）：产出 3.5.0-beta.1 与
#     滚动 :beta，**不移动 :latest**（理由见下面生成 tag 那一步）
#   · 手动 workflow_dispatch：产出 :dev（测试 tag，不碰正式 tag）
#   推 v* tag 时与 build.yml 同时触发 —— 一次打 tag，安装包与镜像一起出来
#
# ── 推到哪里 ─────────────────────────────────────────────────
#   · **GHCR 恒推**：ghcr.io/kuyoos/agent2api。用 Actions 自带的
#     GITHUB_TOKEN 登录（顶层 permissions 给 packages: write 即可），
#     不需要任何 secret。
#     ⚠️ GHCR 的**新包默认私有**：首次推送后要到包的设置里手动改成
#     Public，否则别人 docker pull 会 401（这一步只能人工点，API 改不了）。
#   · **Docker Hub（可选）**：配了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#     才推，镜像名跟着凭据的用户名走（不写死）。没配就整步跳过，
#     工作流照常绿 —— 本 fork 默认只推 GHCR。
#
# ── 镜像名为什么写死 owner ───────────────────────────────────
# 工作流跑在本仓库，`$GITHUB_REPOSITORY` 虽然也能解析对，但它带大小写
# （kuyoos/Agent2API），而镜像名必须全小写；仓库改名后写死的 env 也比
# 隐式变量更容易看出要改哪里。
#
# ── 为什么 runner 上不用装 QEMU ───────────────────────────────
# Dockerfile 的 builder 固定跑在 $BUILDPLATFORM：runner 是 amd64，arm64
# 走 aarch64 工具链交叉编译。本地与 CI 同一套交叉编译路径，无需
# setup-qemu-action，也没有 QEMU 模拟下 Rust 编译慢几十倍的问题。
#
# ── 缓存 ─────────────────────────────────────────────────────
# type=gha 把 BuildKit 缓存挂到 Actions cache：Dockerfile 的「桩依赖层」
# 首次编完整棵依赖树后落缓存，之后每次构建直接命中，只剩源码层重编。
# cache-from/cache-to 与 warm-cache.yml 的 image job 逐字一致，发版构建
# 才能命中 main 作用域里那份缓存。
#
# ── action 版本 ──────────────────────────────────────────────
# 与 build.yml 同一标准：钉在最新大版本。
# setup-buildx v4 / login v4 / metadata v6 / build-push v7。
#
# ── secrets ──────────────────────────────────────────────────
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（Read & Write 权限的 Access Token）
#   两者都配齐才推 Docker Hub；GHCR 不需要任何 secret。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # 推 GHCR 需要（GITHUB_TOKEN 往本仓库名下的包命名空间写）
  packages: write

env:
  GHCR_IMAGE: ghcr.io/kuyoos/agent2api

jobs:
  image:
    runs-on: ubuntu-latest
    # 两个 Docker Hub 凭据放在 **job 级 env**：`steps.if` 读不到 secrets 上下文
    # （GitHub 的 context 可用性表里没有它），但读得到 env —— 于是「配没配」
    # 只判定一次，组装镜像目标与登录两步共用同一份值。没配就是空串。
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      # 镜像目标是一份**新行分隔**的清单：GHCR 恒在，Docker Hub 看凭据。
      # 组装成 step output 再交给 metadata-action（它的 images 本来就是这个形状），
      # 于是 tag 规则（semver / latest / beta / dev）只写一份、两个仓库共用。
      - name: 组装镜像目标
        id: images
        run: |
          images=("$GHCR_IMAGE")
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            images+=("${DOCKERHUB_USERNAME}/agent2api")
          fi
          {
            echo "list<<IMAGES"
            printf '%s\n' "${images[@]}"
            echo "IMAGES"
          } >> "$GITHUB_OUTPUT"
          echo "本次镜像目标："
          printf '  %s\n' "${images[@]}"

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # 没配 Docker Hub 凭据时整步跳过（工作流不会因此变红）
      - name: 登录 Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # tag 推送：v3.5.1 → 3.5.1 + latest；v3.5.0-beta.1 → 3.5.0-beta.1 + beta；
      # 手动触发：只出 dev
      #
      # latest **只跟正式版走**：beta tag 带 `-`，不移动 latest ——
      # 应用里的「加入 beta 版」是一次显式选择，而 `docker pull :latest` 的人没做
      # 这个选择；推一次 beta 就把 :latest 换掉等于绕过那道开关。
      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          # latest 只由下面那条 raw 规则控制；关掉 semver 的自动 latest，
          # 免得同一个 tag 被追加两遍
          flavor: |
            latest=false
          # 包页面指回源码仓库（默认会填成工作流所在仓库，之后若搬家会指错）
          labels: |
            org.opencontainers.image.source=https://github.com/kuyoos/Agent2API
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-') }}
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max