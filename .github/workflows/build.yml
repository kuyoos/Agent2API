name: build

# 编译、打包与发布。
#
# ── 本 fork 的构建策略（与上游不同）────────────────────────────
# 上游把编译派发到独立构建账号（`Agent2Builder/agent2api-releases`），主仓库
# 只推一条 `repository_dispatch`。本 fork 没有那个账号与令牌，照搬的结果是
# 「提交了什么都不编译、推 tag 也什么都不出」。因此这里改回**本地构建**：
#
#   · push / PR：`verify` 跑 `cargo check` + `cargo test`（server crate），几分钟
#     内拦住编译错误与口径回归；前端产物的同源校验由
#     `frontend-artifacts.yml` 单独负责；
#   · 推 `v*` tag：三个构建任务全跑，产出 7 份附件并**自动发布**到本仓库的
#     Release（`kuyoos/Agent2API`）；
#   · 手动 workflow_dispatch：先跑一遍 verify，再构建、不发布，产物留在
#     Actions 的 artifact 里。
#
# ── 只出 Windows 桌面端 + 服务端包 ────────────────────────────
# 本 fork 的实际部署形态只有两种：
#   · 桌面端：只用 Windows（安装包是 NSIS .exe）；
#   · 服务端：Linux 容器 / 裸机 + Windows Server，都是无 GUI 的
#     `agent2api-server` 二进制。
# macOS dmg 与 Linux 桌面端 deb / AppImage 对这两种形态都用不上，逐版多跑
# 两个平台任务（macOS runner 冷启动尤其慢）只为产出没人下载的附件，故移除。
# 注意：`update/version.rs` 的资产名匹配仍保留 dmg / deb / AppImage 分支 ——
# 那是更新检查的通用逻辑，缺资产时面板会提示「这一版只有 .exe」。
#
# ── 为什么必须用 GitHub 托管 runner ──────────────────────────
# Windows 桌面端（NSIS + WebView2）只能在 Windows 上生成；Linux 服务端包
# 要同时出 amd64 与 arm64，走 Dockerfile 的 buildx 交叉编译。本仓库是公开
# 仓库，标准 runner 免费且不计分钟。
#
# ── job 分工 ─────────────────────────────────────────────────
#   verify          → cargo check + cargo test（server crate）
#   windows         → Windows 桌面端 NSIS exe    → artifact: windows-nsis
#   linux-server    → Linux 服务端包（无 GUI）   → artifact: linux-server-{amd64,arm64}
#   windows-server  → Windows 服务端包（无 GUI） → artifact: windows-server-amd64
#   publish         → 仅 tag：建 Release 并逐个上传附件
#
# 手机端（Android / iOS）不在本工作流里：release 包需要签名密钥，fork 没有；
# Web 形态（`ui/m/**`）是入库产物，桌面端 / 服务端 / 镜像直接带上它。
#
# ── action 版本 ──────────────────────────────────────────────
# 统一钉在 v7（checkout / setup-node / upload-artifact）：v4 那一代跑在
# Node.js 20 上，GitHub 已弃用并会强制跑在 Node 24。v7 的 breaking change
# 与本文件的用法都不冲突（name + path 的用法逐字不变）。
#
# ── 签名 ─────────────────────────────────────────────────────
# Windows 安装包默认不签名：首次运行 SmartScreen 会拦一次，点「更多信息 →
# 仍要运行」即可。要消除这一步需配置代码签名证书。

on:
  push:
    branches: [main, beta]
    tags: ['v*']
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  # ── 提交即验证 ──────────────────────────────────────────────
  # 只查 server crate：它不依赖 webkit / gtk，Linux runner 直接可编；桌面壳
  # 的 tauri 依赖树要装一整套系统库，留给标签构建时按平台编。
  verify:
    # tag 推上去时下面三个构建任务已经在编同一份代码，不必再查一遍
    #
    # 手动触发也跑：验证分支（`codex/**`）不触发 push 事件，而本仓库约定
    # 「不在本机构建」—— 没有这一步，独立分支上的改动只能靠开 PR 才能拿到
    # 一次编译检查。多跑一次 check + test 的代价远小于「把没编过的代码当成
    # 编过了」。
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      # 前端产物同源校验由 frontend-artifacts.yml 负责（它已经装齐四个包的
      # 依赖并重建三份产物）；这里不重复跑，免得同一次提交把同一套 npm ci
      # 与 vite build 做两遍。
      - name: 编译检查（server）
        working-directory: desktop-tauri/src-tauri
        run: cargo check --all-targets -p agent2api-server

      # 测试与 check 同源（同一 crate、同一次依赖编译）：积分估算的分摊 /
      # 清算 / 聚合口径都靠这一组端到端用例兜底，只 check 不看行为等于没验。
      # 本仓库是公开仓库，runner 不计分钟，多跑这一步没有成本。
      - name: 单元测试（server）
        working-directory: desktop-tauri/src-tauri
        run: cargo test -p agent2api-server

  # ── Windows 桌面端 ──────────────────────────────────────────
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包
        run: npm --prefix desktop-tauri run build

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # ── Linux 服务端包（容器内一键更新的 Release 资产）──────────
  # 面板在容器里「一键更新」时下载的就是这里的产物：包内是可执行文件 +
  # ui/ 目录。包名与后端挑资产的名字必须逐字一致（server_bundle_name()）。
  linux-server:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 构建服务端包
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --target bundle \
            --output type=local,dest=out \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: 打包并生成校验和
        run: |
          name="agent2api-server-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p dist stage
          rm -rf stage/pkg
          mkdir -p stage/pkg
          cp -r out/bundle/agent2api-server out/bundle/ui stage/pkg/
          cp packaging/linux/install.sh \
             packaging/linux/agent2api.service \
             packaging/linux/agent2api.env.example stage/pkg/
          tar -C stage/pkg -czf "dist/$name" agent2api-server ui \
            install.sh agent2api.service agent2api.env.example
          # 校验文件与包同名 + .sha256：面板按这个名字找它，找不到就拒绝安装
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          cat "dist/$name.sha256"
          ls -lh dist

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: linux-server-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ── Windows 服务端包（无 GUI，注册成 Windows 服务）────────────
  windows-server:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      # 必须在 `desktop-tauri/src-tauri` 下跑：产物目录由
      # `src-tauri/.cargo/config.toml` 的 target-dir 决定，而 cargo 只从 CWD
      # 往上找配置文件。
      - name: 构建服务端
        working-directory: desktop-tauri/src-tauri
        run: cargo build --release -p agent2api-server --bin agent2api-server

      - name: 打包
        shell: pwsh
        run: |
          $name = "agent2api-server-windows-amd64"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/release/agent2api-server.exe" "$stage/"
          Copy-Item -Recurse "desktop-tauri/ui" "$stage/ui"
          Copy-Item "packaging/windows/install-service.ps1" "$stage/"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -Force

          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"

          Get-ChildItem dist | Format-Table Name, Length

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: windows-server-amd64
          path: dist/*
          if-no-files-found: error

  # ── 发布（仅 tag）───────────────────────────────────────────
  # 提交信息 = Release 正文（与上游口径一致：tag 所指提交的完整提交信息）。
  # 附件逐个上传：批量上传遇到同名附件会报 422 并中断整批。
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-server, windows-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 下载全部产物
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: 整理附件
        run: |
          set -euo pipefail
          mkdir -p release
          # Windows 桌面端安装包
          find dist/windows-nsis -name '*.exe' -exec cp {} release/ \;
          # 服务端包：tar.gz / zip 加各自的 .sha256
          cp dist/linux-server-amd64/* dist/linux-server-arm64/* release/
          cp dist/windows-server-amd64/* release/
          echo "── 附件清单 ──"
          ls -lh release
          count="$(find release -maxdepth 1 -type f | wc -l)"
          echo "共 $count 份附件（期望 7）"
          [ "$count" -eq 7 ] || { echo "::error::附件数不是 7，拒绝发布"; exit 1; }

      - name: 建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git log -1 --format=%B HEAD > notes.md
          [ -s notes.md ] || { echo "::error::tag 提交信息为空，Release 正文会没有内容"; exit 1; }
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" $flags --notes-file notes.md
          else
            gh release create "$TAG" $flags --title "$TAG" --notes-file notes.md
          fi
          for asset in release/*; do
            gh release upload "$TAG" "$asset" --clobber
          done
          echo "✅ 已发布 https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
